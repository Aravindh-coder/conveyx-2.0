services:
  # 1. Backend Web Service (Node.js Express + Socket.IO Telemetry Engine)
  - type: web
    name: conveyx-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (React 18 + SCADA Digital Twin UI)
  - type: web
    name: conveyx-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
